# Documentation site: API Reference for Marketo Engage.
#
# Content under reference/ is generated by scripts/build_marketo_api_reference.py
# and mounted into the build by docs-site/hooks/reference_site.py. Navigation for
# the API reference and models is generated from reference/manifest.json.
#
# Local preview:  make docs-serve
# CI build:       make docs-build

site_name: API Reference for Marketo Engage
site_description: >-
  An independent, searchable reference for the Adobe Marketo Engage APIs, generated
  from Adobe's Swagger and OpenAPI specifications, with a client-side request builder
  and mock response generator.
# CI sets SITE_URL from the repository's Pages configuration.
site_url: !ENV [SITE_URL, "https://mkto-ref.harrisonjennings.au/"]
# Header link to the source repository. docs-site/overrides/partials/source.html
# renders it without fetching star and fork counts from api.github.com.
repo_url: https://github.com/harrison-jennings/api-reference-for-marketo-engage
repo_name: harrison-jennings/api-reference-for-marketo-engage
# No "edit this page" links: most pages are generated from reference/.
edit_uri: ""
# Attribution and disclaimer wording follows Adobe's trademark guidelines.
copyright: >-
  THIS SITE IS NOT AUTHORIZED, ENDORSED OR SPONSORED BY ADOBE, PUBLISHER OF ADOBE
  MARKETO ENGAGE. Adobe, Marketo and Marketo Engage are either registered trademarks or trademarks
  of Adobe in the United States and/or other countries.

docs_dir: docs-site/docs
site_dir: site
use_directory_urls: true
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: info

watch:
  - reference
  - postman
  - docs-site/hooks
  - docs-site/overrides

hooks:
  - docs-site/hooks/reference_site.py

theme:
  name: material
  custom_dir: docs-site/overrides
  # Fonts are served locally: no requests to Google Fonts.
  font: false
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/api
  favicon: assets/images/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search:
      # Split paths (/rest/v1/leads.json) on punctuation and separators, but keep
      # camelCase intact so operation IDs (getLeadById) and model names
      # (EmailResponse) match their own pages first.
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - path: assets/request-builder/index.js
    type: module

extra:
  generator: true

# "GENERATED" entries are expanded by the hook from reference/manifest.json.
nav:
  - Home: index.md
  - API Reference: GENERATED
  - Models: GENERATED
  - Request Playground: playground.md
  - Postman: postman.md
  - Search: search.md
  - About: about.md
  - Notices: notices.md
