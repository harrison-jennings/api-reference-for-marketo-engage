name: Documentation site

# Pull requests build and validate the site without deploying.
# Pushes to main build, validate and deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages site configuration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Test Request Builder
        run: make docs-test

      - name: Test repository scripts
        run: make scripts-test PYTHON=python

      - name: Check generated reference is up to date
        run: make reference-check PYTHON=python

      - name: Build and validate site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Use the Pages URL (including any custom domain) for canonical links.
          # Pages reports http:// until HTTPS is enforced; the site is served
          # over HTTPS, so always use it. Pull requests use site_url in mkdocs.yml.
          if [ -n "$PAGES_BASE_URL" ]; then
            base="${PAGES_BASE_URL%/}"
            export SITE_URL="https://${base#http*://}/"
          fi
          make docs-build PYTHON=python

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # actions/deploy-pages publishes the site
      id-token: write # actions/deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
