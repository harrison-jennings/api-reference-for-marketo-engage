name: Documentation site

# Pull requests and pushes to main build and validate the site. Cloudflare Workers Builds deploys it
# (docs/architecture.md). The main ruleset requires the "Build and validate" check, so keep that job name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/postman-runtime/package-lock.json

      - name: Install site dependencies
        run: make web-install

      - name: Test Request Builder
        run: make docs-test

      - name: Test repository scripts
        run: make scripts-test PYTHON=python

      - name: Check generated reference is up to date
        run: make reference-check PYTHON=python

      - name: Test Postman collection
        run: make postman-test

      - name: Check Postman collection is up to date
        run: make postman-check

      - name: Test Postman collection with Postman's runtime
        run: make postman-runtime-test

      - name: Build and validate site
        run: make docs-build

      - name: Install browsers for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: make docs-e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
